<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payments – Bunyi</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --orange: #E8450A; --orange-light: #fff0eb; --dark: #1A1A1A; --white: #fff; --bg: #f8f8f8; --border: #e8e8e8; --muted: #888; --text: #333; --green: #16a34a; --green-light: #f0fdf4; --yellow: #d97706; --yellow-light: #fffbeb; --blue: #2563eb; --blue-light: #eff6ff;
      --crimson: #D72638; --crimson-mid: #b01e2d; --crimson-light: #fde8eb;
      --notif-yellow: #F7B731; --tangerine: #F26419;
    }
    body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .color-strip { height: 4px; background: linear-gradient(90deg, var(--crimson), var(--tangerine), var(--notif-yellow)); }
    .header { background: var(--dark); padding: 0 40px; height: 62px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; position: sticky; top: 0; z-index: 200; box-shadow: 0 2px 12px rgba(0,0,0,0.18); }
    .header-brand { font-size: 1.25rem; font-weight: 700; color: var(--white); letter-spacing: -0.01em; text-decoration: none; justify-self: start; }
    .header-brand span { color: var(--crimson); }
    .header-center { display: flex; align-items: center; gap: 2px; justify-content: center; }
    .nav-link { color: #aaa; text-decoration: none; font-size: 0.82rem; font-weight: 500; padding: 7px 14px; border-radius: 6px; transition: color 0.2s, background 0.2s; white-space: nowrap; }
    .nav-link:hover { color: var(--white); background: rgba(255,255,255,0.18); }
    .nav-link.active { color: var(--white); background: rgba(255,255,255,0.18); border-radius: 6px; }
    .header-right { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
    .notif-wrapper { position: relative; }
    .notif-btn { background: rgba(255,255,255,0.08); border: none; cursor: pointer; font-size: 1.1rem; color: #ccc; display: flex; align-items: center; padding: 7px 10px; border-radius: 8px; transition: background 0.2s, color 0.2s; position: relative; }
    .notif-btn:hover { background: rgba(255,255,255,0.14); color: var(--white); }
    .notif-badge { position: absolute; top: 4px; right: 4px; background: var(--notif-yellow); color: var(--dark); font-size: 0.55rem; font-weight: 700; border-radius: 999px; padding: 1px 5px; min-width: 16px; text-align: center; font-family: 'Poppins', sans-serif; }
    .notif-dropdown { display: none; position: absolute; right: 0; top: 46px; width: 310px; background: var(--white); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.13); z-index: 999; overflow: hidden; }
    .notif-dropdown.open { display: block; }
    .notif-header-row { padding: 13px 15px 9px; border-bottom: 1px solid var(--border); background: var(--bg); }
    .notif-title { font-size: 0.86rem; font-weight: 600; color: var(--dark); }
    .notif-scroll { max-height: 280px; overflow-y: auto; }
    .notif-empty { padding: 22px 15px; font-size: 0.82rem; color: var(--muted); text-align: center; }
    .notif-item { padding: 11px 15px; border-bottom: 1px solid var(--border); text-decoration: none; display: block; transition: background 0.15s; cursor: pointer; }
    .notif-item:last-child { border-bottom: none; }
    .notif-item:hover { background: var(--bg); }
    .notif-item.unread { background: var(--orange-light); }
    .notif-text { font-size: 0.82rem; color: var(--text); line-height: 1.4; }
    .notif-item.unread .notif-text { font-weight: 600; color: var(--dark); }
    .notif-time { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
    .account-wrapper { position: relative; }
    .account-btn { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.08); border: none; cursor: pointer; padding: 0 12px; height: 38px; border-radius: 8px; transition: background 0.2s; font-family: 'Poppins', sans-serif; }
    .account-btn:hover { background: rgba(255,255,255,0.14); }
    .account-avatar { width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; color: var(--white); flex-shrink: 0; border: 1.5px solid rgba(255,255,255,0.5); overflow: hidden; }
    .account-chevron { color: #aaa; font-size: 0.6rem; opacity: 0.6; }
    .account-dropdown { display: none; position: absolute; right: 0; top: 46px; width: 220px; background: var(--white); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.13); z-index: 999; overflow: hidden; }
    .account-dropdown.open { display: block; }
    .account-dropdown-header { padding: 14px 16px 12px; border-bottom: 1px solid var(--border); background: var(--bg); }
    .account-dropdown-name { font-size: 0.88rem; font-weight: 700; color: var(--dark); }
    .account-dropdown-email { font-size: 0.73rem; color: var(--muted); margin-top: 2px; }
    .account-dropdown-item { display: flex; align-items: center; gap: 9px; padding: 11px 16px; font-size: 0.84rem; color: var(--text); text-decoration: none; transition: background 0.15s; font-family: 'Poppins', sans-serif; font-weight: 500; }
    .account-dropdown-item:hover { background: var(--bg); }
    .account-dropdown-item.logout { color: var(--crimson-mid); border-top: 1px solid var(--border); }
    .account-dropdown-item.logout:hover { background: var(--crimson-light); }
    .cart-btn { background: rgba(255,255,255,0.08); border: none; cursor: pointer; font-size: 1.1rem; color: #ccc; display: flex; align-items: center; padding: 7px 10px; border-radius: 8px; transition: background 0.2s; position: relative; text-decoration: none; }
    .cart-btn:hover { background: rgba(255,255,255,0.14); color: var(--white); }
    .cart-badge { position: absolute; top: 4px; right: 4px; background: var(--green); color: #fff; font-size: 0.55rem; font-weight: 700; border-radius: 999px; padding: 1px 5px; min-width: 16px; text-align: center; display: none; }
    .hamburger-btn { display: none !important; background: rgba(255,255,255,0.08); border: none; cursor: pointer; width: 38px; height: 38px; border-radius: 8px; flex-direction: column; align-items: center; justify-content: center; gap: 5px; transition: background 0.2s; }
    .hamburger-btn:hover { background: rgba(255,255,255,0.14); }
    .hamburger-btn span { display: block; width: 18px; height: 2px; background: #ccc; border-radius: 2px; }
    .mobile-nav { display: none; position: fixed; top: 66px; left: 0; right: 0; background: var(--dark); z-index: 199; padding: 8px 16px 12px; border-bottom: 1px solid rgba(255,255,255,0.1); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .mobile-nav.open { display: block; }
    .mobile-nav a { display: block; color: #aaa; text-decoration: none; font-size: 0.9rem; font-weight: 500; padding: 12px 14px; border-radius: 8px; transition: color 0.2s, background 0.2s; }
    .mobile-nav a:hover, .mobile-nav a.active { color: var(--white); background: rgba(255,255,255,0.18); }
    @media (max-width: 780px) { .header { padding: 0 16px; grid-template-columns: auto 1fr auto; } .header-center { gap: 0; display: none !important; } .nav-link { font-size: 0.75rem; padding: 6px 8px; } .hamburger-btn { display: flex !important; } }

    /* PAGE STYLES */
    .main { max-width: 900px; margin: 0 auto; padding: 40px 24px 80px; }
    .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); text-decoration: none; margin-bottom: 20px; transition: color 0.2s; }
    .back-link:hover { color: var(--orange); }
    .page-eyebrow { font-size: 0.7rem; font-weight: 600; color: var(--orange); text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 5px; }
    .page-title { font-size: 1.4rem; font-weight: 700; color: var(--dark); margin-bottom: 20px; }
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
    .filter-btn { padding: 7px 16px; border: 1.5px solid var(--border); border-radius: 999px; font-family: 'Poppins', sans-serif; font-size: 0.78rem; font-weight: 600; color: var(--muted); background: var(--white); cursor: pointer; transition: all 0.2s; }
    .filter-btn:hover, .filter-btn.active { border-color: var(--orange); color: var(--orange); background: var(--orange-light); }
    .results-count { font-size: 0.78rem; color: var(--muted); margin-bottom: 14px; }
    .search-bar-wrap { position: relative; margin-bottom: 16px; }
    .search-bar-wrap input { width: 100%; padding: 10px 16px 10px 40px; border: 1.5px solid var(--border); border-radius: 10px; font-family: 'Poppins', sans-serif; font-size: 0.85rem; color: var(--dark); background: var(--white); outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
    .search-bar-wrap input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(232,69,10,0.08); }
    .search-bar-wrap input::placeholder { color: var(--muted); }
    .search-icon { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); font-size: 0.9rem; pointer-events: none; opacity: 0.45; }

    /* CARD — mirrors caterer-bookings.html */
    .payment-card { background: var(--white); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: box-shadow 0.2s; }
    .payment-card:hover { box-shadow: 0 4px 18px rgba(0,0,0,0.09); }
    .card-header { padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
    .card-header.hdr-pending { background: #2a2020; }
    .card-header.hdr-partial { background: #2a1a0a; }
    .card-header.hdr-verified { background: #1a3a2a; }
    .card-caterer { font-size: 0.97rem; font-weight: 700; color: var(--white); }
    .card-booking-id { font-size: 0.66rem; color: #aaa; font-family: monospace; margin-top: 3px; letter-spacing: 0.04em; }
    .badge { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 12px; border-radius: 999px; }
    .badge-pending { background: #fffbeb; color: #b45309; }
    .badge-partial { background: var(--orange-light); color: var(--orange); }
    .badge-paid { background: var(--green-light); color: var(--green); }
    .badge-verified { background: #dcfce7; color: #15803d; }
    .card-section { padding: 14px 20px; border-bottom: 1px solid #f0f0f0; }
    .card-section:last-of-type { border-bottom: none; }
    .section-label { font-size: 0.63rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .order-item { margin-bottom: 5px; }
    .order-item-name { font-size: 0.9rem; font-weight: 600; color: var(--dark); }
    .order-item-sub { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }
    .orders-total-sub { font-size: 0.72rem; color: var(--muted); margin-top: 6px; }
    .card-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .card-field-label { font-size: 0.63rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 3px; }
    .card-field-value { font-size: 0.86rem; font-weight: 600; color: var(--dark); }
    .card-field-value.green { color: var(--green); }
    .card-field-value.orange { color: var(--orange); }
    .receipt-link { font-size: 0.82rem; font-weight: 600; color: var(--orange); text-decoration: none; }
    .receipt-link:hover { text-decoration: underline; }

    /* SPLIT PAYMENT PANEL — same as caterer-bookings.html, NO verify buttons */
    .payment-split { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid #f0f0f0; }
    .payment-panel { padding: 16px 20px; }
    .payment-panel + .payment-panel { border-left: 2px dashed var(--border); background: #fafafa; }
    .panel-heading { font-size: 0.68rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; }
    .panel-heading .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .dot-orange { background: var(--orange); }
    .dot-blue { background: #2563eb; }
    .panel-field { margin-bottom: 10px; }
    .panel-field:last-of-type { margin-bottom: 0; }
    .panel-label { font-size: 0.62rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 2px; }
    .panel-value { font-size: 0.85rem; font-weight: 600; color: var(--dark); }
    .panel-value.green { color: var(--green); }
    .panel-value.orange { color: var(--orange); }
    .panel-value.blue { color: #2563eb; }
    .panel-status-row { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
    .panel-status-note { font-size: 0.75rem; font-weight: 600; }
    .remaining-empty { font-size: 0.82rem; color: var(--muted); font-style: italic; padding: 8px 0; }

    /* Single payment status note */
    .status-note-row { padding: 11px 20px; border-top: 1.5px solid #fde8d0; background: #fffbf7; }
    .status-note-row.verified { border-top-color: #86efac; background: #f0fdf4; }

    .empty-state { text-align: center; padding: 48px 24px; color: var(--muted); }
    .empty-icon { font-size: 2.2rem; margin-bottom: 10px; }
    .empty-state p { font-size: 0.86rem; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { opacity: 0; animation: fadeUp 0.35s ease forwards; }
    @media (max-width: 700px) { .card-row { grid-template-columns: 1fr 1fr; } .payment-split { grid-template-columns: 1fr; } .payment-panel + .payment-panel { border-left: none; border-top: 2px dashed var(--border); } }
  </style>
</head>
<body>

  <div class="color-strip"></div>
  <div class="mobile-nav" id="mobileNav">
    <a href="/dashboard">Dashboard</a>
    <a href="/browse">Browse</a>
    <a href="/chats">Messages</a>
  </div>
  <header class="header">
    <a href="/dashboard" class="header-brand">Bunyi<span>.</span></a>
    <nav class="header-center">
      <a href="/dashboard" class="nav-link">Dashboard</a>
      <a href="/browse" class="nav-link">Browse</a>
      <a href="/chats" class="nav-link">Messages</a>
    </nav>
    <div class="header-right">
      <button class="hamburger-btn" onclick="toggleMobileNav()" id="hamburgerBtn">
        <span></span><span></span><span></span>
      </button>
      <a href="/cart" class="cart-btn" title="My Cart">
        🛒 <span class="cart-badge" id="cartBadge">0</span>
      </a>
      <div class="notif-wrapper">
        <button class="notif-btn" onclick="toggleNotifDropdown()">
          🔔 <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
        </button>
        <div class="notif-dropdown" id="notifDropdown">
          <div class="notif-header-row"><span class="notif-title">Notifications</span></div>
          <div class="notif-scroll" id="notifList"><p class="notif-empty">No notifications yet.</p></div>
        </div>
      </div>
      <div class="account-wrapper">
        <button class="account-btn" onclick="toggleAccountDropdown()">
          <div class="account-avatar" id="accountAvatar">?</div>
          <span class="account-chevron">▼</span>
        </button>
        <div class="account-dropdown" id="accountDropdown">
          <div class="account-dropdown-header">
            <div class="account-dropdown-name" id="accountDropdownName">—</div>
            <div class="account-dropdown-email" id="accountDropdownEmail">—</div>
          </div>
          <a href="/account" class="account-dropdown-item">👤 My Account</a>
          <a href="/logout" class="account-dropdown-item logout">🚪 Log Out</a>
        </div>
      </div>
    </div>
  </header>

  <main class="main">
    <a href="/dashboard" class="back-link">← Back to Dashboard</a>
    <p class="page-eyebrow">Payments</p>
    <h1 class="page-title">💳 My Payments</h1>
    <div class="search-bar-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search by Booking ID or Caterer name..." oninput="renderPayments()">
    </div>
    <div class="filter-bar">
      <button class="filter-btn" id="btnAll" onclick="applyFilter('all', this)">All</button>
      <button class="filter-btn" id="btnPending" onclick="applyFilter('pending', this)">Pending</button>
      <button class="filter-btn" id="btnVerified" onclick="applyFilter('verified', this)">Verified</button>
    </div>
    <div class="results-count" id="resultsCount"></div>
    <div id="paymentsList"><p style="color:var(--muted);font-size:0.88rem;">Loading...</p></div>
  </main>

  <script>
    var allBookings = [];
    var currentFilter = 'all';

    function formatDate(d) { if (!d) return '—'; return new Date(d + 'T00:00:00').toLocaleDateString('en-PH', { year: 'numeric', month: 'long', day: 'numeric' }); }
    function formatTime(t) { if (!t) return '—'; var p = t.split(':'); var h = parseInt(p[0]); var m = p[1] || '00'; return (h % 12 || 12) + ':' + m + ' ' + (h >= 12 ? 'PM' : 'AM'); }

    function formatOrders(b) {
      if (b.cartItems && b.cartItems.length > 0) {
        var items = b.cartItems;
        var totalQty = items.reduce(function(s, i) { return s + (parseInt(i.qty) || 1); }, 0);
        var html = items.map(function(i) {
          return '<div class="order-item"><div class="order-item-name">' + (i.pkgName || i.name || 'Item') + '</div>'
            + '<div class="order-item-sub">' + (i.qty || 1) + ' pc(s)</div></div>';
        }).join('');
        html += '<div class="orders-total-sub">Total qty: ' + totalQty + '</div>';
        return html;
      }
      return '<div class="order-item"><div class="order-item-name">' + (b.packageName || '—') + '</div></div>';
    }

    function paymentCard(b) {
      var total = parseFloat(b.totalAmount) || 0;
      var paid = parseFloat(b.amountPaid) || 0;
      var isVerified = !!b.verified;
      var status = b.status || 'Pending Payment';

      // Cash on Pick-up logic
      if (b.platform === 'Cash on Pick-up') {
        paid = 0;
      }
            // Treat completed Cash on Pick-up orders as verified
      if (
        b.platform === 'Cash on Pick-up' &&
        b.status === 'Order Completed'
      ) {
        isVerified = true;
      }
      var isPartial = status === 'Partially Paid';
      var hasReceipt2 = !!(b.receipt2 && b.receipt2 !== 'undefined' && b.receipt2 !== 'null');
      // Show split layout if partial OR customer already submitted remaining
      var showSplit = isPartial || hasReceipt2;
      // Fully done = verified + Fully Paid + receipt2 exists
      var isFullyDone = isVerified && status === 'Fully Paid' && hasReceipt2;

      var hdrClass = isFullyDone ? 'hdr-verified' : (isPartial ? 'hdr-partial' : (isVerified && status === 'Fully Paid' ? 'hdr-verified' : 'hdr-pending'));
      var badgeText, badgeClass;
      if (isFullyDone) {
          badgeText = '✓ Verified';
          badgeClass = 'badge-verified';
        }
        else if (
          (isVerified && status === 'Fully Paid') ||
          status === 'Order Completed'
        ) {
          badgeText = '✓ Verified';
          badgeClass = 'badge-verified';
        }
        else if (status === 'Fully Paid') {
        if (b.platform === 'Cash on Pick-up') {
          badgeText = 'Awaiting Pick Up';
          badgeClass = 'badge-pending';
        } else {
          badgeText = 'Fully Paid';
          badgeClass = 'badge-paid';
        }
      }
        else if (isPartial) {
          badgeText = 'Partially Paid';
          badgeClass = 'badge-partial';
        }
        else {
          badgeText = 'Pending Verification';
          badgeClass = 'badge-pending';
        }

      var receipt1HTML = (b.receipt && b.receipt !== 'undefined' && b.receipt !== 'null')
        ? '<a href="' + b.receipt + '" target="_blank" class="receipt-link">📎 View Receipt</a>'
        : '<span style="color:var(--muted);font-size:0.82rem;">No receipt</span>';

      var html = '<div class="payment-card fade-in">';
      html += '<div class="card-header ' + hdrClass + '">';
      html += '<div><div class="card-caterer">' + (b.caterer || '—') + '</div>';
      html += '<div class="card-booking-id">Booking ID: ' + (b.bookingId || b.id || '—') + '</div></div>';
      html += '<span class="badge ' + badgeClass + '">' + badgeText + '</span></div>';

      // Orders section
      html += '<div class="card-section"><div class="section-label">List of Orders</div>' + formatOrders(b) + '</div>';

      if (!showSplit) {
        // ── Single payment layout ──
        var remaining = total - paid;
        html += '<div class="card-section"><div class="card-row">';
        html += '<div><div class="card-field-label">Event Type</div><div class="card-field-value">' + (b.eventType || '—') + '</div></div>';
        html += '<div><div class="card-field-label">Payment Platform</div><div class="card-field-value">' + (b.platform || '—') + '</div></div>';
        html += '<div><div class="card-field-label">Reference No.</div><div class="card-field-value">' + (b.reference || '—') + '</div></div>';
        html += '</div></div>';
        html += '<div class="card-section"><div class="card-row">';
        html += '<div><div class="card-field-label">Pick Up Date</div><div class="card-field-value">' + formatDate(b.date) + '</div></div>';
        html += '<div><div class="card-field-label">Pick Up Time</div><div class="card-field-value">' + formatTime(b.time) + '</div></div>';
        html += '<div><div class="card-field-label">Receipt</div><div class="card-field-value">' + receipt1HTML + '</div></div>';
        html += '</div></div>';
        html += '<div class="card-section"><div class="card-row">';
        html += '<div><div class="card-field-label">Total Amount</div><div class="card-field-value">₱' + total.toFixed(2) + '</div></div>';
        if (b.platform === 'Cash on Pick-up') {
          html += '<div><div class="card-field-label">Amount Paid</div><div class="card-field-value orange">₱0.00</div></div>';
          html += '<div><div class="card-field-label">Remaining Balance</div><div class="card-field-value orange">Upon Pick Up</div></div>';
        } else {

          html += '<div><div class="card-field-label">Amount Paid</div><div class="card-field-value green">₱' + paid.toFixed(2) + '</div></div>';
          html += '<div><div class="card-field-label">Remaining Balance</div><div class="card-field-value ' + (remaining <= 0 ? 'green' : 'orange') + '">₱' + remaining.toFixed(2) + '</div></div>';
        }
        html += '</div></div>';
                // Status note — no verify button (customer view)
                if (isVerified) {
                if (b.platform === 'Cash on Pick-up' && b.status !== 'Order Completed') {
                  html += '<div class="status-note-row verified"><span style="font-size:0.75rem;color:var(--green);font-weight:600;">✅ Payment will be settled upon pick-up</span></div>';
                } else {
                  html += '<div class="status-note-row verified"><span style="font-size:0.75rem;color:var(--green);font-weight:600;">✅ Payment verified by caterer</span></div>';
              }
              } else {
                  html += '<div class="status-note-row"><span style="font-size:0.75rem;color:var(--muted);">⏳ Awaiting caterer verification</span></div>';
                }
      } else {
        // ── SPLIT PAYMENT LAYOUT (mirrors caterer view, no verify buttons) ──
        var remaining2Amount = parseFloat(b.remaining2) || (total / 2);
        var initPaid = hasReceipt2 ? (total - remaining2Amount) : paid;
        var initRemaining = hasReceipt2 ? remaining2Amount : (total - paid);

        // Initial payment status note
        var initStatusHTML = '';
        if (isVerified) {
          initStatusHTML = '<div class="panel-status-row"><span class="panel-status-note" style="color:var(--green);">✅ Initial payment verified</span></div>';
        } else {
          initStatusHTML = '<div class="panel-status-row"><span class="panel-status-note" style="color:var(--muted);">⏳ Awaiting caterer verification</span></div>';
        }

        var initPanel = '<div class="payment-panel">'
          + '<div class="panel-heading"><span class="dot dot-orange"></span>Initial Payment</div>'
          + '<div class="panel-field"><div class="panel-label">Event Type</div><div class="panel-value">' + (b.eventType || '—') + '</div></div>'
          + '<div class="panel-field"><div class="panel-label">Payment Platform</div><div class="panel-value">' + (b.platform || '—') + '</div></div>'
          + '<div class="panel-field"><div class="panel-label">Reference No.</div><div class="panel-value">' + (b.reference || '—') + '</div></div>'
          + '<div class="panel-field"><div class="panel-label">Pick Up Date</div><div class="panel-value">' + formatDate(b.date) + '</div></div>'
          + '<div class="panel-field"><div class="panel-label">Pick Up Time</div><div class="panel-value">' + formatTime(b.time) + '</div></div>'
          + '<div class="panel-field"><div class="panel-label">Receipt</div><div class="panel-value">' + receipt1HTML + '</div></div>'
          + '<div class="panel-field"><div class="panel-label">Total Amount</div><div class="panel-value">₱' + total.toFixed(2) + '</div></div>'
          + '<div class="panel-field"><div class="panel-label">Amount Paid</div><div class="panel-value green">₱' + initPaid.toFixed(2) + '</div></div>'
          + '<div class="panel-field"><div class="panel-label">Remaining Balance</div><div class="panel-value ' + (initRemaining <= 0 ? 'green' : 'orange') + '">₱' + initRemaining.toFixed(2) + '</div></div>'
          + initStatusHTML
          + '</div>';

        var receipt2HTML = hasReceipt2
          ? '<a href="' + b.receipt2 + '" target="_blank" class="receipt-link">📎 View Receipt</a>'
          : '<span style="color:var(--muted);font-size:0.82rem;">No receipt</span>';

        // Remaining panel status note — NO verify button (customer view)
        var remainStatusHTML = '';
        if (isFullyDone) {
          remainStatusHTML = '<div class="panel-status-row"><span class="panel-status-note" style="color:var(--green);font-weight:700;">✅ Remaining balance verified</span></div>';
        } else if (hasReceipt2) {
          remainStatusHTML = '<div class="panel-status-row"><span class="panel-status-note" style="color:var(--muted);">⏳ Awaiting caterer verification</span></div>';
        }

        var remainPanel = '<div class="payment-panel">'
          + '<div class="panel-heading"><span class="dot dot-blue"></span>Remaining Balance Payment</div>'
          + (hasReceipt2
            ? '<div class="panel-field"><div class="panel-label">Remaining Balance</div><div class="panel-value blue">₱' + remaining2Amount.toFixed(2) + '</div></div>'
              + '<div class="panel-field"><div class="panel-label">Amount Paid</div><div class="panel-value green">₱' + remaining2Amount.toFixed(2) + '</div></div>'
              + '<div class="panel-field"><div class="panel-label">Payment Platform</div><div class="panel-value">' + (b.platform2 || '—') + '</div></div>'
              + '<div class="panel-field"><div class="panel-label">Reference No.</div><div class="panel-value">' + (b.reference2 || '—') + '</div></div>'
              + '<div class="panel-field"><div class="panel-label">Receipt</div><div class="panel-value">' + receipt2HTML + '</div></div>'
              + remainStatusHTML
            : '<p class="remaining-empty">You have not submitted your remaining balance yet. Go to your Dashboard to pay.</p>')
          + '</div>';

        html += '<div class="payment-split">' + initPanel + remainPanel + '</div>';
      }

      html += '</div>';
      return html;
    }

    function applyFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
      if (btn) btn.classList.add('active');
      renderPayments();
    }

    function renderPayments() {
      var q = (document.getElementById('searchInput').value || '').toLowerCase().trim();
      var filtered = allBookings.slice().reverse();

      if (currentFilter === 'pending') {

        filtered = filtered.filter(function(b) {

          // Completed orders should not be pending
          if (b.status === 'Order Completed') {
            return false;
          }
          // Verified payments should not be pending
          if (b.verified === true) {
            return false;
          }
          return true;
        });
      } 
      else if (currentFilter === 'verified') {
        filtered = filtered.filter(function(b) {
          return (
            b.verified === true ||
            b.status === 'Order Completed'
          );
        });
      }

      if (q) {
        filtered = filtered.filter(function(b) {
          return (b.caterer || '').toLowerCase().includes(q) ||
                 (b.bookingId || b.id || '').toLowerCase().includes(q);
        });
      }

      document.getElementById('resultsCount').textContent = filtered.length + ' payment record' + (filtered.length !== 1 ? 's' : '') + ' found';
      var list = document.getElementById('paymentsList');
      if (filtered.length === 0) { list.innerHTML = '<div class="empty-state"><div class="empty-icon">💳</div><p>No payment records found for this filter.</p></div>'; }
      else { list.innerHTML = filtered.map(paymentCard).join(''); }
    }

    async function loadPayments() {
      try {
        const sessionRes = await fetch('/session-user');
        const sessionUser = await sessionRes.json();
        var res = await fetch('/bookings');
        const allData = await res.json();
        // Filter only this user's bookings
        allBookings = allData.filter(function(b) {
          return b.senderEmail === sessionUser.email ||
                 b.sender === sessionUser.name;
        });
        var params = new URLSearchParams(window.location.search);
        var filterParam = params.get('filter');
        if (filterParam === 'pending') { applyFilter('pending', document.getElementById('btnPending')); }
        else if (filterParam === 'verified') { applyFilter('verified', document.getElementById('btnVerified')); }
        else { applyFilter('all', document.getElementById('btnAll')); }
      } catch(e) {
        document.getElementById('paymentsList').innerHTML = '<p style="color:var(--muted);font-size:0.88rem;">Error loading payments.</p>';
      }
    }

    function loadCartBadge() {
      try { var cart = JSON.parse(sessionStorage.getItem('bunyi_cart') || '[]'); var total = cart.reduce(function(s,i){return s+(i.qty||1);},0); var badge = document.getElementById('cartBadge'); badge.textContent = total; badge.style.display = total > 0 ? 'inline-block' : 'none'; } catch(e) {}
    }

    async function loadUserInfo() {
      try {
        var res = await fetch('/session-user'); var data = await res.json();
        if (data && data.name) {
          var avatarEl = document.getElementById('accountAvatar');
          if (data.photo) { avatarEl.style.background = 'none'; avatarEl.innerHTML = '<img src="' + data.photo + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">'; }
          else { avatarEl.textContent = data.name.charAt(0).toUpperCase(); }
          document.getElementById('accountDropdownName').textContent = data.name;
          document.getElementById('accountDropdownEmail').textContent = data.email || '';
        }
      } catch(e) {}
    }

    function formatNotifTime(ts) {
      var d = ts && ts.toDate ? ts.toDate() : (ts && ts._seconds ? new Date(ts._seconds * 1000) : new Date(ts));
      return d.toLocaleTimeString('en-PH', { hour: '2-digit', minute: '2-digit' }) + ' · ' + d.toLocaleDateString('en-PH', { month: 'short', day: 'numeric' });
    }

    async function loadNotifications() {
      try {
        var res = await fetch('/notifications'); var data = await res.json();
        var badge = document.getElementById('notifBadge'); var list = document.getElementById('notifList');
        var unread = data.filter(function(n) { return !n.isRead; }).length;
        if (unread > 0) { badge.style.display = 'inline-block'; badge.textContent = unread; } else { badge.style.display = 'none'; }
        if (data.length === 0) { list.innerHTML = '<p class="notif-empty">No notifications yet.</p>'; return; }
        list.innerHTML = '';
        data.forEach(n => {
          var a = document.createElement('a');
          a.className = 'notif-item' + (n.isRead ? '' : ' unread');
          a.href = '#';
          a.onclick = async function(e) {
            e.preventDefault();
            await fetch('/read-notification', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: n.id }) });
            var text = (n.text || '').toLowerCase();
            if (n.type === 'reminder' || text.includes('remaining balance') || text.includes('balance due') || text.includes('partially paid') || text.includes('due')) {
              window.location.href = '/dashboard';
            } else if (n.type === 'message' || text.includes('message') || text.includes('chat')) {
              window.location.href = '/chats';
            } else {
              window.location.href = '/events';
            }
          };
          a.innerHTML = '<div class="notif-text">' + n.text + '</div><div class="notif-time">' + formatNotifTime(n.createdAt) + '</div>';
          list.appendChild(a);
        });
      } catch(e) {}
    }

    async function toggleNotifDropdown() {
      var dd = document.getElementById('notifDropdown'); var ad = document.getElementById('accountDropdown');
      if (ad) ad.classList.remove('open'); dd.classList.toggle('open');
      if (dd.classList.contains('open')) { await loadNotifications(); }
    }
    function toggleAccountDropdown() {
      var ad = document.getElementById('accountDropdown'); var nd = document.getElementById('notifDropdown');
      if (nd) nd.classList.remove('open'); ad.classList.toggle('open');
    }
    document.addEventListener('click', function(e) {
      var nw = document.querySelector('.notif-wrapper'); if (nw && !nw.contains(e.target)) { var dd = document.getElementById('notifDropdown'); if (dd) dd.classList.remove('open'); }
      var aw = document.querySelector('.account-wrapper'); if (aw && !aw.contains(e.target)) { var ad = document.getElementById('accountDropdown'); if (ad) ad.classList.remove('open'); }
      var nav = document.getElementById('mobileNav'); var btn = document.getElementById('hamburgerBtn');
      if (nav && btn && !nav.contains(e.target) && !btn.contains(e.target)) nav.classList.remove('open');
    });

    function toggleMobileNav() { document.getElementById('mobileNav').classList.toggle('open'); }

    loadPayments(); loadUserInfo(); loadCartBadge(); loadNotifications(); setInterval(loadNotifications, 5000);
  </script>
